name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epaphrodites_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql, pdo_sqlite, gd, intl, mbstring, zip
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Configure example settings
        run: |
          cp bin/config/Config.ini.example bin/config/Config.ini
          cp bin/config/email.ini.example bin/config/email.ini
          python3 - <<'PY'
          import configparser

          path = "bin/config/Config.ini"
          config = configparser.ConfigParser()
          config.optionxform = str
          config.read(path)
          config["1_CONFIGURATION"].update({
              "DRIVER": "mysql",
              "DATABASE": "epaphrodites_test",
              "HOST": "127.0.0.1",
              "PORT": "3306",
              "USER": "root",
              "PASSWORD": "root",
          })
          with open(path, "w", encoding="utf-8") as settings:
              config.write(settings)
          PY
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: MySQL migrations and seeding
        env:
          MYSQL_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=epaphrodites_test;charset=utf8mb4
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: root
        run: vendor/bin/phpunit --filter MysqlMigrationTest
      - name: Start web server and run PHPUnit
        env:
          PUBLIC_SITE_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=epaphrodites_test;charset=utf8mb4
          PUBLIC_SITE_MYSQL_USER: root
          PUBLIC_SITE_MYSQL_PASSWORD: root
        run: |
          python3 - <<'PY'
          import configparser

          path = "bin/config/Config.ini"
          config = configparser.ConfigParser()
          config.optionxform = str
          config.read(path)
          config["SITE"]["PHONE"] = '"+225 0102030405"'
          with open(path, "w", encoding="utf-8") as settings:
              config.write(settings)
          PY

          php -r '
          require "bin/config/SetDirectory.php";
          require "vendor/autoload.php";
          Epaphrodites\services\PublicSiteConfig::local();
          '

          php -S 127.0.0.1:8000 > /tmp/epaphrodites-server.log 2>&1 &

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/ > /dev/null || {
            cat /tmp/epaphrodites-server.log
            exit 1
          }
          vendor/bin/phpunit --exclude-group mysql-migration
