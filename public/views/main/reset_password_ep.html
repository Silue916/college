{% extends layouts %}
{% block content %}
<main class="container py-5" style="max-width: 32rem">
    <h1>Choisir un nouveau mot de passe</h1>
    {% if reponse %}
        <div class="alert {{ alert }}" role="alert">{{ reponse }}</div>
    {% endif %}
    <form method="POST">
        {{ __csrf() }}
        <input type="hidden" name="token" value="{{ token|e }}">
        <div class="mb-3">
            <label class="form-label" for="password">Nouveau mot de passe</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
            <div class="form-text">8 caractères minimum, avec au moins une lettre et un chiffre.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password_confirmation">Confirmer le mot de passe</label>
            <input class="form-control" id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Réinitialiser</button>
    </form>
</main>
{% endblock %}
