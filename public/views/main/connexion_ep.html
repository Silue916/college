{% extends layouts %}
{% block content %}
<main class="container py-5" style="max-width: 32rem">
    <h1>Connexion</h1>
    {% if reponse %}
        <div class="alert {{ alert }}" role="alert">{{ reponse }}</div>
    {% endif %}
    <form method="POST">
        {{ __csrf() }}
        <div class="mb-3">
            <label class="form-label" for="identifier">Adresse e-mail ou matricule</label>
            <input class="form-control" id="identifier" name="identifier" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Mot de passe</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Se connecter</button>
    </form>
    <p class="mt-3"><a href="/forgot_password/">Mot de passe oublié ?</a></p>
</main>
{% endblock %}
