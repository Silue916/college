{% extends layouts %}
{% block content %}
<main class="container py-5" style="max-width: 32rem">
    <h1>Réinitialiser le mot de passe</h1>
    {% if reponse %}
        <div class="alert {{ alert }}" role="alert">{{ reponse }}</div>
    {% endif %}
    <form method="POST">
        {{ __csrf() }}
        <div class="mb-3">
            <label class="form-label" for="email">Adresse e-mail du compte</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn-primary" type="submit">Envoyer le lien</button>
    </form>
</main>
{% endblock %}
